<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 단어">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>오늘의 단어 — 어휘끝</title>
<style>
:root{
  --bg:#0a0f1e;--s1:#111827;--s2:#1a2235;--bd:#1e2d45;
  --acc:#4f8fff;--ok:#10b981;--no:#ef4444;--warn:#f59e0b;
  --t1:#f0f4ff;--t2:#8b9dc3;--t3:#4a5980;
  --r:18px;--fe:'Syne',sans-serif;--fk:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--fk)}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto}

/* ── PAGES ── */
.pg{flex:1;overflow-y:auto;display:none;flex-direction:column;padding:20px;gap:16px}
.pg.on{display:flex}

/* ── HOME ── */
.hero{background:linear-gradient(135deg,#1a2a5e,#0f1b3d);border:1px solid #2a3f70;border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(79,143,255,.2),transparent 70%);border-radius:50%}
.hero-label{font-size:11px;color:var(--acc);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.hero-title{font-family:var(--fe);font-size:48px;font-weight:800;color:#fff;line-height:1}
.hero-sub{font-size:13px;color:var(--t2);margin-top:6px}
.streak{display:inline-flex;align-items:center;gap:5px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--warn);margin-top:12px}

.sec-title{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.8px;text-transform:uppercase}

/* count picker */
.count-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.count-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.count-display{font-family:var(--fe);font-size:52px;font-weight:800;color:var(--acc);line-height:1;min-width:80px}
.count-desc{font-size:12px;color:var(--t3);line-height:1.5}
.slider{width:100%;-webkit-appearance:none;height:4px;border-radius:99px;background:var(--bd);outline:none;margin:8px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 0 0 4px rgba(79,143,255,.2)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap}
.preset{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--t3);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--fk);transition:all .2s}
.preset.on{background:var(--acc);border-color:var(--acc);color:#fff}

.big-btn{width:100%;padding:17px;border-radius:14px;border:none;font-size:16px;font-weight:800;font-family:var(--fk);cursor:pointer;transition:all .15s;letter-spacing:.3px}
.big-btn:active{transform:scale(.97)}
.btn-acc{background:var(--acc);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-no{background:rgba(239,68,68,.15);color:var(--no);border:1px solid rgba(239,68,68,.3)}
.btn-gray{background:var(--s1);color:var(--t2);border:1px solid var(--bd)}

/* stats row */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-box{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 10px;text-align:center}
.stat-n{font-family:var(--fe);font-size:24px;font-weight:800}
.stat-l{font-size:10px;color:var(--t3);margin-top:2px}

/* ── STUDY / FLASH ── */
.fc-header{display:flex;align-items:center;gap:10px}
.back-btn{background:transparent;border:none;color:var(--t3);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1}
.fc-prog-wrap{flex:1;height:4px;background:var(--bd);border-radius:99px;overflow:hidden}
.fc-prog-fill{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.fc-ctr{font-size:12px;color:var(--t3);font-family:var(--fe);font-weight:700;white-space:nowrap}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;cursor:pointer;user-select:none;position:relative;transition:background .2s}
.card.flipped{background:var(--s2)}
.card-id{position:absolute;top:14px;left:16px;font-size:11px;color:var(--t3);font-family:var(--fe);font-weight:700}
.card-word{font-family:var(--fe);font-size:34px;font-weight:800;color:var(--t1);text-align:center;letter-spacing:-.5px;line-height:1.1}
.card-pos{font-size:12px;color:var(--acc);font-weight:700;margin-top:12px;display:none}
.card-meaning{font-size:15px;color:var(--t2);text-align:center;line-height:1.65;margin-top:6px;display:none;max-width:360px}
.card-hint{position:absolute;bottom:14px;font-size:11px;color:var(--t3)}
.card-tts{position:absolute;bottom:12px;right:16px;background:transparent;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:4px}

.fc-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fc-btn{padding:14px 8px;border-radius:12px;border:none;font-size:13px;font-weight:700;font-family:var(--fk);cursor:pointer;transition:all .15s}
.fc-btn:active{transform:scale(.96)}

/* ── QUIZ ── */
.quiz-q-box{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:24px 20px;text-align:center}
.quiz-q-label{font-size:11px;color:var(--t3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.quiz-q-word{font-family:var(--fe);font-size:30px;font-weight:800;color:var(--t1)}
.quiz-q-tts{background:transparent;border:none;font-size:18px;cursor:pointer;margin-top:6px;padding:4px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:14px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);color:var(--t1);font-size:13px;font-family:var(--fk);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .15s}
.choice:active{transform:scale(.98)}
.choice.correct{background:rgba(16,185,129,.15);border-color:var(--ok);color:var(--ok)}
.choice.wrong{background:rgba(239,68,68,.15);border-color:var(--no);color:var(--no)}
.c-letter{width:26px;height:26px;border-radius:99px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-family:var(--fe);flex-shrink:0}

/* ── RESULT ── */
.result-hero{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px}
.result-ring{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--acc)}
.result-score{font-family:var(--fe);font-size:32px;font-weight:800;color:var(--acc)}
.result-lbl{font-size:11px;color:var(--t3)}
.result-msg{font-size:20px;font-weight:800;color:var(--t1)}
.result-detail{font-size:13px;color:var(--t2);text-align:center;line-height:1.7}

.wrong-list{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.wrong-title{font-size:12px;font-weight:700;color:var(--no);margin-bottom:12px}
.wrong-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(30,45,69,.5)}
.wrong-item:last-child{border-bottom:none}
.wi-word{font-family:var(--fe);font-size:14px;font-weight:700;color:var(--t1);min-width:100px}
.wi-mean{font-size:12px;color:var(--t2);line-height:1.4}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--bd);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;color:var(--t1);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ══ HOME ══ -->
<div class="pg on" id="pg-home">

  <div class="hero">
    <div class="hero-label">오늘의 학습</div>
    <div class="hero-title" id="homeCount">20</div>
    <div class="hero-sub">단어 암기 + 퀴즈 테스트</div>
    <div class="streak">🔥 <span id="streakNum">0</span>일 연속</div>
  </div>

  <div class="sec-title">오늘 단어 수</div>
  <div class="count-wrap">
    <div class="count-row">
      <div class="count-display" id="countDisplay">20</div>
      <div class="count-desc">개 단어를<br>오늘 학습해요</div>
    </div>
    <input type="range" class="slider" id="countSlider" min="5" max="100" step="5" value="20" oninput="updateCount(this.value)">
    <div class="preset-row" style="margin-top:10px">
      <button class="preset" onclick="setCount(10)">10개</button>
      <button class="preset on" onclick="setCount(20)">20개</button>
      <button class="preset" onclick="setCount(30)">30개</button>
      <button class="preset" onclick="setCount(50)">50개</button>
      <button class="preset" onclick="randomCount()">🎲 랜덤</button>
    </div>
  </div>

  <div class="sec-title">오늘의 범위</div>
  <div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--t3)">전체 1–1800에서 랜덤</span>
      <label style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer">
        <span style="font-size:12px;color:var(--t3)">범위 지정</span>
        <input type="checkbox" id="useRange" onchange="toggleRange()" style="width:16px;height:16px;cursor:pointer">
      </label>
    </div>
    <div id="rangeInputs" style="display:none;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px">
        <input type="number" id="rangeFrom" min="1" max="1800" value="1" placeholder="1"
          style="flex:1;background:transparent;border:none;color:var(--t1);font-size:15px;font-family:var(--fe);font-weight:700;outline:none;text-align:center">
        <span style="color:var(--t3)">–</span>
        <input type="number" id="rangeTo" min="1" max="1800" value="1800" placeholder="1800"
          style="flex:1;background:transparent;border:none;color:var(--t1);font-size:15px;font-family:var(--fe);font-weight:700;outline:none;text-align:center">
      </div>
    </div>
  </div>

  <div class="sec-title">통계</div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-n" style="color:var(--warn)" id="stStreak">0</div><div class="stat-lbl">연속일</div></div>
    <div class="stat-box"><div class="stat-n" style="color:var(--ok)" id="stTotal">0</div><div class="stat-lbl">총 학습</div></div>
    <div class="stat-box"><div class="stat-n" style="color:var(--acc)" id="stAcc">0%</div><div class="stat-lbl">퀴즈 정답률</div></div>
  </div>

  <button class="big-btn btn-acc" onclick="startSession()">🚀 오늘 학습 시작</button>
</div>

<!-- ══ STUDY ══ -->
<div class="pg" id="pg-study">
  <div class="fc-header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="fc-prog-wrap"><div class="fc-prog-fill" id="studyFill" style="width:0%"></div></div>
    <div class="fc-ctr" id="studyCtr">0/0</div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:13px;color:var(--t2);font-weight:700">📖 암기 학습</div>
    <div style="font-size:11px;color:var(--t3)">영어 + 뜻 함께 암기</div>
  </div>

  <div class="card" id="studyCard" onclick="speak(studyWords[studyIdx].word)" style="cursor:pointer">
    <span class="card-id" id="studyId"></span>
    <div class="card-word" id="studyWord"></div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
      <button class="card-tts" onclick="event.stopPropagation();speak(studyWords[studyIdx].word)" style="position:static;font-size:16px">🔊</button>
    </div>
    <div class="card-pos" id="studyPos" style="display:block!important;margin-top:14px"></div>
    <div class="card-meaning" id="studyMeaning" style="display:block!important;margin-top:4px"></div>
  </div>

  <div class="fc-btns">
    <button class="fc-btn btn-gray" onclick="studyPrev()" style="font-size:16px">◀</button>
    <button class="fc-btn" id="markBtn"
      style="background:rgba(239,68,68,.15);color:var(--no);border:1px solid rgba(239,68,68,.3)"
      onclick="toggleMark()">❌ 모름</button>
    <button class="fc-btn btn-acc" onclick="studyNext()">다음 ▶</button>
  </div>

  <button class="big-btn btn-ok" onclick="goToQuiz()" style="margin-top:4px">✅ 다 봤어요 — 퀴즈 시작</button>
</div>

<!-- ══ QUIZ ══ -->
<div class="pg" id="pg-quiz">
  <div class="fc-header">
    <button class="back-btn" onclick="goStudy()">‹</button>
    <div class="fc-prog-wrap"><div class="fc-prog-fill" id="quizFill" style="width:0%"></div></div>
    <div class="fc-ctr" id="quizCtr">0/0</div>
  </div>

  <div style="font-size:13px;color:var(--t2);font-weight:700">📝 퀴즈 테스트</div>

  <div class="quiz-q-box">
    <div class="quiz-q-label" id="quizLabel">단어의 뜻을 고르세요</div>
    <div class="quiz-q-word" id="quizWord"></div>
    <button class="quiz-q-tts" id="quizTts" onclick="speak(quizWords[quizIdx].word)">🔊</button>
  </div>

  <div class="choices" id="choices"></div>
</div>

<!-- ══ RESULT ══ -->
<div class="pg" id="pg-result">
  <div class="result-hero">
    <div class="result-ring">
      <div class="result-score" id="resultScore">0/0</div>
      <div class="result-lbl">정답</div>
    </div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-detail" id="resultDetail"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <button class="big-btn btn-gray" onclick="retryWrong()" id="retryBtn">❌ 틀린 것만</button>
    <button class="big-btn btn-acc" onclick="goHome()">🏠 홈으로</button>
  </div>

  <div class="wrong-list" id="wrongList" style="display:none">
    <div class="wrong-title">❌ 틀린 단어</div>
    <div id="wrongItems"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

, "meaning": "동 경멸하다, 멸시하다 (= scorn, look down on)"}, {"id": 1786, "word": "contempt", "meaning": "명 경멸, 멸시 (= scorn)"}, {"id": 1787, "word": "brutal", "meaning": "형 잔인한, 잔혹한 (= cruel)"}, {"id": 1788, "word": "savage", "meaning": "형 야만적인; 포악한, 몹시 사나운"}, {"id": 1789, "word": "insane", "meaning": "형 제정신이 아닌, 미친 (↔ sane 제정신인)"}, {"id": 1790, "word": "frantic", "meaning": "형 (걱정, 공포 등으로) 제정신이 아닌; 정신없이 서두는"}, {"id": 1791, "word": "thrifty", "meaning": "형 절약하는, 검소한"}, {"id": 1792, "word": "overlook", "meaning": "동 1. 간과하다, 못 보고 넘어가다 (= miss) 2. 눈감아 주다 3. 내려다보다"}, {"id": 1793, "word": "coward", "meaning": "명 겁쟁이"}, {"id": 1794, "word": "flatter", "meaning": "동 아첨[아부]하다, 알랑거리다"}, {"id": 1795, "word": "lure", "meaning": "동 꾀다, 유혹하다 (= tempt)"}, {"id": 1796, "word": "brag", "meaning": "동 (심하게) 자랑하다, 떠벌리다"}, {"id": 1797, "word": "old-fashioned", "meaning": "형 전통적인 사고방식을 지닌; 구식의, 유행이 지난"}, {"id": 1798, "word": "hesitant", "meaning": "형 주저하는"}, {"id": 1799, "word": "blunt", "meaning": "형 1. 직설적인 (= direct) 2. 무딘, 뭉툭한 (↔ sharp 날카로운, 예리한)"}, {"id": 1800, "word": "settle", "meaning": "동 정착하다"}];

// ── STATE ──────────────────────────────────────────
const S = {
  count: 20,
  streak: 0, lastDate: '',
  totalLearned: 0,
  quizTotal: 0, quizCorrect: 0,
};
function loadS(){
  const d = localStorage.getItem('odv2');
  if(d) Object.assign(S, JSON.parse(d));
}
function saveS(){
  localStorage.setItem('odv2', JSON.stringify(S));
}
loadS();

// ── TODAY SESSION ───────────────────────────────────
let studyWords = [], quizWords = [];
let studyIdx = 0, quizIdx = 0;
let studyFlipped = false;
let quizAnswered = false;
let markedUnknown = new Set();
let wrongWords = [];
let quizCorrectCount = 0;

// ── HELPERS ─────────────────────────────────────────
function parseMeaning(raw){
  const m = raw.match(/^([명동형부전접대])\s+(.+)/s);
  return m ? {pos:m[1], mean:m[2]} : {pos:'', mean:raw};
}
function speak(w){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w);
  u.lang='en-US'; u.rate=0.85;
  window.speechSynthesis.speak(u);
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function pg(id){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.getElementById('pg-'+id).classList.add('on');
  document.getElementById('pg-'+id).scrollTop = 0;
}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

// ── HOME ────────────────────────────────────────────
function updateCount(v){
  v = parseInt(v);
  S.count = v;
  document.getElementById('countDisplay').textContent = v;
  document.getElementById('homeCount').textContent = v;
  document.getElementById('countSlider').value = v;
  document.querySelectorAll('.preset').forEach(b=>b.classList.remove('on'));
  [10,20,30,50].forEach(n=>{
    if(n===v) document.querySelectorAll('.preset').forEach(b=>{
      if(b.textContent===n+'개') b.classList.add('on');
    });
  });
  saveS();
}
function setCount(n){
  updateCount(n);
}
function randomCount(){
  const options=[10,15,20,25,30,40,50];
  updateCount(options[Math.floor(Math.random()*options.length)]);
  toast('🎲 ' + S.count + '개로 랜덤 설정!');
}
function toggleRange(){
  const show = document.getElementById('useRange').checked;
  document.getElementById('rangeInputs').style.display = show ? 'flex' : 'none';
}

function updateHomeStats(){
  document.getElementById('stStreak').textContent = S.streak;
  document.getElementById('stTotal').textContent = S.totalLearned.toLocaleString();
  document.getElementById('stAcc').textContent = S.quizTotal
    ? Math.round(S.quizCorrect/S.quizTotal*100)+'%' : '—';
  document.getElementById('streakNum').textContent = S.streak;
}

function startSession(){
  const useRange = document.getElementById('useRange').checked;
  let pool = [...ALL];
  if(useRange){
    const lo = parseInt(document.getElementById('rangeFrom').value)||1;
    const hi = parseInt(document.getElementById('rangeTo').value)||1800;
    pool = ALL.filter(v=>v.id>=lo && v.id<=hi);
  }
  if(pool.length < 4){ toast('범위 안 단어가 너무 적어요 (최소 4개)'); return; }
  const n = Math.min(S.count, pool.length);
  studyWords = shuffle([...pool]).slice(0, n);
  markedUnknown = new Set();
  studyIdx = 0;
  renderStudyCard();
  pg('study');
}

// ── STUDY ───────────────────────────────────────────
function renderStudyCard(){
  const v = studyWords[studyIdx];
  const {pos,mean} = parseMeaning(v.meaning);
  document.getElementById('studyId').textContent = String(v.id).padStart(4,'0');
  document.getElementById('studyWord').textContent = v.word;
  document.getElementById('studyPos').textContent = pos ? pos+'사' : '';
  document.getElementById('studyMeaning').textContent = mean;
  const mb = document.getElementById('markBtn');
  mb.textContent = markedUnknown.has(v.id) ? '↩ 취소' : '❌ 모름';
  const pct = studyWords.length>1 ? studyIdx/(studyWords.length-1)*100 : 100;
  document.getElementById('studyFill').style.width = pct+'%';
  document.getElementById('studyCtr').textContent = (studyIdx+1)+' / '+studyWords.length;
  speak(v.word);
}
function studyNext(){
  if(studyIdx < studyWords.length-1){ studyIdx++; renderStudyCard(); }
  else{ toast('마지막 단어예요! 퀴즈 버튼을 눌러요 👇'); }
}
function studyPrev(){
  if(studyIdx > 0){ studyIdx--; renderStudyCard(); }
}
function toggleMark(){
  const id = studyWords[studyIdx].id;
  if(markedUnknown.has(id)) markedUnknown.delete(id);
  else markedUnknown.add(id);
  renderStudyCard();
}

// ── QUIZ ────────────────────────────────────────────
function goToQuiz(){
  quizWords = shuffle([...studyWords]);
  quizIdx = 0; quizCorrectCount = 0; quizAnswered = false;
  wrongWords = [];
  renderQuizQ();
  pg('quiz');
}
function goStudy(){ pg('study'); }

function renderQuizQ(){
  if(quizIdx >= quizWords.length){ endQuiz(); return; }
  quizAnswered = false;
  const v = quizWords[quizIdx];
  const pct = quizWords.length>1 ? quizIdx/(quizWords.length-1)*100 : 0;
  document.getElementById('quizFill').style.width = pct+'%';
  document.getElementById('quizCtr').textContent = (quizIdx+1)+' / '+quizWords.length;
  document.getElementById('quizWord').textContent = v.word;

  // 4 choices: 1 correct + 3 wrongs from ALL (not just today's)
  const wrongs = shuffle(ALL.filter(x=>x.id!==v.id)).slice(0,3);
  const choices = shuffle([v, ...wrongs]);
  const letters = ['A','B','C','D'];
  document.getElementById('choices').innerHTML = choices.map((c,i)=>{
    const {mean} = parseMeaning(c.meaning);
    const disp = mean.length>55 ? mean.slice(0,55)+'…' : mean;
    return `<button class="choice" data-id="${c.id}" onclick="answer(${c.id},${v.id},this)">
      <span class="c-letter">${letters[i]}</span>
      <span>${disp}</span>
    </button>`;
  }).join('');
}
function answer(chosen, correct, btn){
  if(quizAnswered) return;
  quizAnswered = true;
  const ok = chosen === correct;
  if(ok){ quizCorrectCount++; btn.classList.add('correct'); }
  else{
    btn.classList.add('wrong');
    document.querySelector(`[data-id="${correct}"]`)?.classList.add('correct');
    wrongWords.push(quizWords[quizIdx]);
  }
  S.quizTotal++; if(ok) S.quizCorrect++;
  S.totalLearned = Math.max(S.totalLearned, (S.totalLearned||0)+0);
  saveS();
  setTimeout(()=>{ quizIdx++; renderQuizQ(); }, 900);
}
function endQuiz(){
  // Update streak
  const t = todayStr();
  if(S.lastDate !== t){
    const yd = new Date(); yd.setDate(yd.getDate()-1);
    S.streak = (S.lastDate === yd.toISOString().slice(0,10)) ? S.streak+1 : 1;
    S.lastDate = t;
    S.totalLearned += studyWords.length;
  }
  saveS();
  showResult();
}
function showResult(){
  const tot = quizWords.length;
  const pct = Math.round(quizCorrectCount/tot*100);
  document.getElementById('resultScore').textContent = quizCorrectCount+'/'+tot;
  const msgs=[
    [90,'🏆 완벽해!'],
    [70,'👏 잘했어!'],
    [50,'💪 조금 더!'],
    [0,'📖 복습하자!']
  ];
  document.getElementById('resultMsg').textContent = msgs.find(m=>pct>=m[0])[1];
  document.getElementById('resultDetail').textContent =
    `정답률 ${pct}% · 맞힌 ${quizCorrectCount}개 · 틀린 ${wrongWords.length}개`;

  const retryBtn = document.getElementById('retryBtn');
  if(wrongWords.length === 0){
    retryBtn.style.display='none';
    document.getElementById('wrongList').style.display='none';
  } else {
    retryBtn.style.display='';
    document.getElementById('wrongList').style.display='';
    document.getElementById('wrongItems').innerHTML = wrongWords.map(v=>{
      const {mean} = parseMeaning(v.meaning);
      return `<div class="wrong-item">
        <div class="wi-word" onclick="speak('${v.word}')">${v.word} 🔊</div>
        <div class="wi-mean">${mean.length>50?mean.slice(0,50)+'…':mean}</div>
      </div>`;
    }).join('');
  }
  updateHomeStats();
  pg('result');
}
function retryWrong(){
  if(wrongWords.length===0) return;
  studyWords = [...wrongWords];
  markedUnknown = new Set();
  studyIdx = 0;
  renderStudyCard();
  pg('study');
}
function goHome(){
  updateHomeStats();
  pg('home');
}

// ── KEYBOARD ─────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const cur = document.querySelector('.pg.on')?.id;
  if(cur==='pg-study'){
    if(e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); studyFlipped?studyNext():flipStudy(); }
    if(e.key==='ArrowLeft') studyPrev();
    if(e.key==='x'||e.key==='m') toggleMark();
  }
});

// ── INIT ─────────────────────────────────────────────
updateCount(S.count||20);
updateHomeStats();
</script>
</body>
</html>
